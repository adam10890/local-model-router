name: Windows bundle

on:
  workflow_dispatch:
    inputs:
      full_offline:
        description: "Include the CPU runtime and Qwen model, then run the full offline smoke"
        required: false
        default: false
        type: boolean
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  bundle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.6"
      - run: python -m pip install --upgrade pip
      - name: Install test dependencies
        run: python -m pip install -e ".[dev,agents]"
      - name: Run hermetic tests
        run: python -m pytest tests -q
      - name: Verify source and package metadata
        shell: pwsh
        run: |
          python -m compileall -q local_model_router tests
          git diff --check
          $version = (python -c "from local_model_router import __version__; print(__version__)").Trim()
          if ($version -ne "0.8.0") { throw "Package version is $version, expected 0.8.0." }
      - name: Build self-contained bundle
        shell: pwsh
        run: |
          $offline = "${{ inputs.full_offline }}" -eq "true"
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
            if ($offline) {
              ./scripts/build_windows_bundle.ps1 -Version $version -IncludeOfflineAssets -OfflineBackends cpu
            } else {
              ./scripts/build_windows_bundle.ps1 -Version $version
            }
          } else {
            if ($offline) {
              ./scripts/build_windows_bundle.ps1 -IncludeOfflineAssets -OfflineBackends cpu
            } else {
              ./scripts/build_windows_bundle.ps1
            }
          }
      - name: Test clean installation
        shell: pwsh
        run: |
          if ("${{ inputs.full_offline }}" -eq "true") {
            ./scripts/test_windows_cleanroom.ps1 -FullOfflineSetup
          } else {
            ./scripts/test_windows_cleanroom.ps1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: imperium-windows-x64
          path: |
            build/windows/*.zip
            build/windows/*.sha256
      - name: Publish tagged release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-ChildItem build/windows/Imperium-*-windows-x64.zip | Select-Object -First 1
          gh release create "${{ github.ref_name }}" $zip.FullName "$($zip.FullName).sha256" --generate-notes
