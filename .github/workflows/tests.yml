name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,mcp]"
      - run: python -m compileall -q local_model_router scripts/smoke_harnesses.py
      - name: Run hermetic suite with coverage gates
        run: |
          coverage erase
          coverage run --source=local_model_router -m pytest tests/ -q
          coverage report --fail-under=75
          coverage report --include="local_model_router/helpers/backends/*" --fail-under=70
          coverage report --include="local_model_router/mcp/*" --fail-under=70
          coverage report --include="local_model_router/cli.py,local_model_router/setup/*" --fail-under=70
