# Lints the decision log in docs/adr/ with tools/adr.py (ADR-0016).
name: adr-lint
on:
  pull_request:
    paths: ["docs/adr/**"]
  push:
    branches: [main]
    paths: ["docs/adr/**"]
  schedule:
    - cron: "0 6 * * 1"   # weekly maintenance (L6)
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Lint ADR log
        run: |
          BASE="origin/${{ github.base_ref || 'main' }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 tools/adr.py lint --base "$BASE"
          else
            python3 tools/adr.py lint
          fi
