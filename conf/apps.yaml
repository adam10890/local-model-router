# App (client) profiles. Clients identify with the X-App-Id header;
# unknown or missing ids get the permissive "default" profile.
#
# Per profile:
#   default_model:  used when the request omits "model"
#   allowed_models: list of aliases/model ids, or ["*"] for everything
#   allow_auto_route: whether model "auto" is permitted
#   notes: free text

apps:
  default:
    default_model: auto
    allowed_models: ["*"]
    allow_auto_route: true
    notes: "Fallback profile for unidentified clients."

  agent_zero:
    display_name: "Agent Zero"
    default_model: chat
    roles:                          # per-harness role -> local model (see docs/HARNESSES.md)
      chat: gemma-4-12b             # foreground ego
      planner: "dmr/huggingface.co/mradermacher/vibethinker-3b-gguf:Q8_0"  # VibeThinker via Docker Model Runner (orchestrator DEFAULT_MODEL_HINT)
      utility: qwen3.5-9b
      embedding: nomic-embed-text
    allowed_models: ["*"]
    allow_auto_route: true
    notes: "Agent Zero main/utility/embedding roles via the lmm_router provider."

  hermes:
    display_name: "LMM ROUTER"      # what Hermes shows as its model name
    default_model: chat
    roles:
      chat: gemma-4-12b             # the local model Hermes actually gets
    allowed_models: ["*"]
    allow_auto_route: true

  n8n:
    default_model: fast
    allowed_models: ["auto", "fast", "utility", "chat", "coder", "embedding"]
    allow_auto_route: true
    notes: "Workflow automation — prefer the fast lane by default."

  open_webui:
    default_model: auto
    allowed_models: ["*"]
    allow_auto_route: true

  aider:
    default_model: coder
    allowed_models: ["coder", "fast", "chat", "deep"]
    allow_auto_route: true
    notes: "Coding assistant — defaults to the coder lane."
