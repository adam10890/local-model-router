# Upstream backend providers beyond the local llama.cpp fleet.
#
# One adapter type — openai_compatible — covers Ollama, vLLM, LocalAI,
# LM Studio, llama-swap, LiteLLM, and any other server exposing /v1.
# Reference models as "<name>/<model-id>", e.g. model: "ollama/llama3.3:70b".
#
# API keys are read from the environment variable named in api_key_env.
# Never put key material in this file.
#
# Auto-routing (opt-in): set A0_LMM_ROUTER_AUTO_UPSTREAMS=1 and declare a
# "models:" list of bare model ids on an upstream to let `model: auto` fall
# back to those models when no healthy local slot can serve the request.
# Local slots always win while healthy; without a models list the upstream
# stays reachable only by explicit "<name>/<model>" addressing.
#
# type: subscription is for CLI-driven providers with no HTTP surface at all
# (Codex, Ollama Cloud's CLI path) — no base_url, so serves_inference is
# always false; invoke names the local runner (e.g. "codex_cli") and
# default_model is the model id assumed when none is given.
#
# limits: (either type) declares the provider's own published rolling-window
# usage caps, since subscription plans expose no remaining-quota API to poll
# — usage against them is counted locally instead. Each entry is a window
# ("5h"/"7d", i.e. <int><h|d>) plus max_tokens and/or max_requests:
#   limits:
#     - window: "5h"
#       max_tokens: 1000000
#     - window: "7d"
#       max_requests: 5000

upstreams:
  - name: dmr
    type: openai_compatible
    base_url: http://localhost:12434/engines/v1
    enabled: true
    notes: "Docker Model Runner. 'docker model pull hf.co/...' then reference as dmr/<model-id>. Peer compute manager — not under the router's VRAM admission control (fork #1)."

  - name: ollama
    type: openai_compatible
    base_url: http://localhost:11434/v1
    enabled: false
    notes: "Ollama's OpenAI-compatible endpoint. Enable when Ollama runs locally."

  - name: vllm
    type: openai_compatible
    base_url: http://localhost:8000/v1
    enabled: false
    notes: "vLLM OpenAI server. High-throughput serving for one pinned model."

  - name: lmstudio
    type: openai_compatible
    base_url: http://localhost:1234/v1
    enabled: false
    notes: "LM Studio local server."

  - name: codex
    type: subscription
    invoke: codex_cli
    default_model: gpt-5-codex
    enabled: false
    limits:
      - window: "5h"
        max_tokens: 1000000
      - window: "7d"
        max_requests: 5000
    notes: "OpenAI Codex CLI subscription. No HTTP surface — invoked as a local process; limits are declared from the published plan, not measured live."

  - name: ollama_cloud
    type: openai_compatible
    base_url: https://ollama.com/v1
    api_key_env: OLLAMA_API_KEY
    enabled: false
    limits:
      - window: "1h"
        max_requests: 200
      - window: "1d"
        max_tokens: 5000000
    notes: "Ollama Cloud's hosted OpenAI-compatible endpoint. Declared limits count against the subscription plan since there's no live quota API."
