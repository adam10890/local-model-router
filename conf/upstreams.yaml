# Upstream backend providers beyond the local llama.cpp fleet.
#
# One adapter type — openai_compatible — covers Ollama, vLLM, LocalAI,
# LM Studio, llama-swap, LiteLLM, and any other server exposing /v1.
# Reference models as "<name>/<model-id>", e.g. model: "ollama/llama3.3:70b".
#
# API keys are read from the environment variable named in api_key_env.
# Never put key material in this file.
#
# Auto-routing (opt-in): set A0_LMM_ROUTER_AUTO_UPSTREAMS=1 and declare a
# "models:" list of bare model ids on an upstream to let `model: auto` fall
# back to those models when no healthy local slot can serve the request.
# Local slots always win while healthy; without a models list the upstream
# stays reachable only by explicit "<name>/<model>" addressing.

upstreams:
  - name: dmr
    type: openai_compatible
    base_url: http://localhost:12434/engines/v1
    enabled: true
    notes: "Docker Model Runner. 'docker model pull hf.co/...' then reference as dmr/<model-id>. Peer compute manager — not under the router's VRAM admission control (fork #1)."

  - name: ollama
    type: openai_compatible
    base_url: http://localhost:11434/v1
    enabled: false
    notes: "Ollama's OpenAI-compatible endpoint. Enable when Ollama runs locally."

  - name: vllm
    type: openai_compatible
    base_url: http://localhost:8000/v1
    enabled: false
    notes: "vLLM OpenAI server. High-throughput serving for one pinned model."

  - name: lmstudio
    type: openai_compatible
    base_url: http://localhost:1234/v1
    enabled: false
    notes: "LM Studio local server."
