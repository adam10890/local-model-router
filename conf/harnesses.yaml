# Dedicated client-runtime connections. Each connection is pinned to one model.
# API keys stay in the environment and never belong in this file.
#
# Hermes chat uses DMR Ornith while local llama.cpp slots are down / without
# mmproj. When a local ornith slot exists with mmproj_path, pin to that slot
# id instead and set supports_vision after a real image smoke.
harnesses:
  hermes:
    display_name: Hermes
    kind: hermes
    protocol: openai
    location: host
    connections:
      default:
        model: dmr/huggingface.co/deepreinforce-ai/ornith-1.0-9b-gguf:Q8_0

  pi:
    display_name: Pi
    kind: pi
    protocol: openai
    location: host
    connections:
      default:
        model: utility_cpu

  claude_code_local:
    display_name: Claude Code (local)
    kind: claude_code
    protocol: openai
    location: host
    connections:
      default:
        model: dmr/huggingface.co/deepreinforce-ai/ornith-1.0-9b-gguf:Q8_0
