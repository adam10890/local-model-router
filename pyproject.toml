[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-model-router"
dynamic = ["version"]
description = "Local-first model router: one OpenAI-compatible gateway in front of a local llama.cpp fleet, with explainable routing, health/failover, and a fleet-manager control plane."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Adam Frantz" }]
keywords = ["llm", "router", "llama.cpp", "openai-compatible", "local-first"]
dependencies = [
    "aiohttp>=3.9",
    "pydantic>=2.5",
    "starlette>=0.37",
    "uvicorn>=0.29",
    "pyyaml>=6.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx2"]
docker = ["docker>=7"]
mcp = ["mcp>=1.22.0"]

[project.scripts]
local-model-router = "local_model_router.cli:main"

[project.urls]
Source = "https://github.com/adam10890/local-model-router"

[tool.setuptools.dynamic]
version = { attr = "local_model_router.__version__" }

[tool.setuptools.packages.find]
include = ["local_model_router*"]

[tool.setuptools.package-data]
local_model_router = ["dashboard/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
