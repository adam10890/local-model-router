<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="application-name" content="Imperium">
  <link rel="icon" href="/ui/icons/cube.svg" type="image/svg+xml">
  <title>Imperium — Local model router</title>
  <style>
    :root {
      --font: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
      --mono: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
      --bg: #f7f8fa;
      --surface: #ffffff;
      --surface-subtle: #f2f4f8;
      --surface-raised: #ffffff;
      --sidebar: #fbfbfc;
      --text: #171a21;
      --text-soft: #5f6674;
      --text-faint: #858c98;
      --border: #dfe2e8;
      --border-strong: #c9ced8;
      --primary: #3157c8;
      --primary-hover: #2448b8;
      --primary-soft: #edf1ff;
      --success: #378f43;
      --success-soft: #edf8ef;
      --warning: #c96c00;
      --warning-soft: #fff5e8;
      --danger: #b83a42;
      --danger-soft: #fff0f1;
      --focus: #6c8cff;
      --shadow: 0 14px 38px rgba(26, 34, 57, .08);
      --radius-sm: 8px;
      --radius: 12px;
      --radius-lg: 18px;
      --sidebar-width: 276px;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 24px;
      --space-6: 32px;
      --space-7: 48px;
      --space-8: 64px;
    }
    html[data-theme="dark"] {
      --bg: #11141a;
      --surface: #191d25;
      --surface-subtle: #202630;
      --surface-raised: #1d222b;
      --sidebar: #151920;
      --text: #f3f5f8;
      --text-soft: #b0b7c4;
      --text-faint: #858e9e;
      --border: #303641;
      --border-strong: #434b59;
      --primary: #809cff;
      --primary-hover: #99afff;
      --primary-soft: #212c4f;
      --success: #6fc27a;
      --success-soft: #1d3323;
      --warning: #f2a13d;
      --warning-soft: #3a2a18;
      --danger: #ef7c83;
      --danger-soft: #3c2226;
      --focus: #9cb0ff;
      --shadow: 0 18px 44px rgba(0, 0, 0, .24);
    }
    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--bg); }
    body { margin: 0; min-height: 100vh; color: var(--text); background: var(--bg); font: 15px/1.5 var(--font); }
    button, input, select, textarea { font: inherit; }
    button, a, input, select, textarea { outline: none; }
    :focus-visible { box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 35%, transparent); border-color: var(--focus) !important; }
    button { color: inherit; }
    a { color: var(--primary); text-decoration: none; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 10px; font-size: clamp(34px, 4vw, 52px); line-height: 1.08; letter-spacing: -.035em; }
    h2 { margin-bottom: 8px; font-size: 26px; line-height: 1.18; letter-spacing: -.02em; }
    h3 { margin-bottom: 6px; font-size: 18px; line-height: 1.3; }
    .muted { color: var(--text-soft); }
    .faint { color: var(--text-faint); }
    .mono, code { direction: ltr; unicode-bidi: isolate; font-family: var(--mono); font-size: .9em; }
    .shell { display: grid; grid-template-columns: var(--sidebar-width) minmax(0,1fr); min-height: 100vh; }
    .sidebar { position: sticky; inset-block-start: 0; height: 100vh; display: flex; flex-direction: column; padding: 28px 16px 18px; overflow-y: auto; background: var(--sidebar); border-inline-end: 1px solid var(--border); }
    .brand { display: flex; align-items: center; gap: 12px; padding: 0 12px 30px; }
    .brand-mark { display: grid; width: 42px; height: 42px; place-items: center; border-radius: 13px; background: #172549; }
    .brand-mark img { filter: invert(1); width: 25px; height: 25px; }
    .brand strong { display: block; font-size: 20px; line-height: 1.15; letter-spacing: -.015em; }
    .brand span { color: var(--text-soft); font-size: 13px; }
    .version { display: inline-flex; margin-top: 4px; padding: 1px 7px; border-radius: 5px; background: var(--surface-subtle); color: var(--text-soft); font-size: 11px; }
    .nav { display: grid; gap: 5px; }
    .nav-button, .advanced-toggle { width: 100%; display: flex; align-items: center; gap: 13px; min-height: 46px; padding: 0 13px; border: 0; border-radius: 10px; color: var(--text-soft); background: transparent; cursor: pointer; text-align: start; }
    .nav-button:hover, .advanced-toggle:hover { color: var(--text); background: var(--surface-subtle); }
    .nav-button.active { color: var(--primary); background: var(--primary-soft); font-weight: 600; }
    .nav-button img, .advanced-toggle img, .side-control img { width: 22px; height: 22px; opacity: .82; }
    .nav-button.active img { filter: invert(37%) sepia(73%) saturate(1200%) hue-rotate(200deg); }
    html[data-theme="dark"] .nav-button img, html[data-theme="dark"] .advanced-toggle img, html[data-theme="dark"] .side-control img, html[data-theme="dark"] .icon { filter: invert(1); }
    .advanced { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--border); }
    .advanced-toggle .caret { margin-inline-start: auto; width: 16px; transition: transform .18s ease; }
    .advanced-toggle[aria-expanded="true"] .caret { transform: rotate(180deg); }
    .advanced-items { display: none; padding: 5px 0 0 15px; }
    .advanced-items.open { display: grid; gap: 3px; }
    .advanced-items .nav-button { min-height: 38px; font-size: 13px; }
    .sidebar-footer { margin-top: auto; padding-top: 26px; }
    .side-control { width: 100%; display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 10px; min-height: 42px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; color: var(--text-soft); cursor: pointer; text-align: start; }
    .side-control:hover { background: var(--surface-subtle); color: var(--text); }
    .side-value { color: var(--text); font-size: 13px; }
    .system-time { display: flex; align-items: flex-start; gap: 12px; margin-top: 16px; padding: 18px 12px 0; border-top: 1px solid var(--border); font-size: 12px; }
    .status-dot { flex: 0 0 auto; width: 10px; height: 10px; margin-top: 4px; border-radius: 99px; background: var(--success); }
    .main { min-width: 0; padding: 64px clamp(28px, 5vw, 76px); }
    .page { width: min(1120px,100%); margin: 0 auto; animation: enter .18s ease; }
    @keyframes enter { from { opacity: .45; transform: translateY(4px); } }
    .page-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; margin-bottom: 36px; }
    .page-header p { max-width: 720px; margin-bottom: 0; color: var(--text-soft); font-size: 17px; }
    .eyebrow { margin-bottom: 8px; color: var(--primary); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .button { display: inline-flex; align-items: center; justify-content: center; gap: 9px; min-height: 42px; padding: 0 17px; border: 1px solid var(--border-strong); border-radius: 9px; background: var(--surface); color: var(--text); font-weight: 600; cursor: pointer; }
    .button:hover { border-color: var(--primary); color: var(--primary); }
    .button.primary { border-color: var(--primary); background: var(--primary); color: #fff; }
    html[data-theme="dark"] .button.primary { color: #111722; }
    .button.primary:hover { background: var(--primary-hover); color: #fff; }
    .button.danger { border-color: var(--danger); color: var(--danger); }
    .button.ghost { border-color: transparent; background: transparent; }
    .button.small { min-height: 34px; padding: 0 12px; font-size: 13px; }
    .button img { width: 18px; height: 18px; }
    .button.primary img { filter: invert(1); }
    .button:disabled { opacity: .5; cursor: not-allowed; }
    .status-banner { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 26px; padding: 16px 18px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
    .status-banner > div { min-width: 0; overflow-wrap: anywhere; }
    .status-banner.warning { border-color: color-mix(in srgb,var(--warning) 35%,var(--border)); background: var(--warning-soft); }
    .status-banner.success { border-color: color-mix(in srgb,var(--success) 30%,var(--border)); background: var(--success-soft); }
    .status-banner img { width: 22px; height: 22px; }
    .readiness { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); margin: 56px 0 64px; }
    .stage { position: relative; min-width: 0; padding-inline-end: 34px; }
    .stage:not(:last-child)::after { content: ""; position: absolute; inset-block-start: 20px; inset-inline-start: 50px; width: calc(100% - 58px); height: 1px; background: var(--border-strong); }
    .stage-head { position: relative; z-index: 1; display: flex; align-items: center; gap: 12px; min-height: 42px; }
    .stage-icon { display: grid; flex: 0 0 auto; width: 42px; height: 42px; place-items: center; border: 2px solid var(--border-strong); border-radius: 50%; background: var(--bg); }
    .stage-icon img { width: 20px; height: 20px; }
    .stage.complete .stage-icon { border-color: var(--success); }
    .stage.complete .stage-title { color: var(--success); }
    .stage.current .stage-icon { border-color: var(--warning); }
    .stage.current .stage-title { color: var(--warning); }
    .stage-title { font-weight: 650; }
    .stage-detail { margin: 8px 0 0 54px; color: var(--text-soft); font-size: 13px; }
    .section-title { margin-bottom: 28px; }
    .section-title p { margin: 0; color: var(--text-soft); }
    .model-recommendation { padding: 0; border-bottom: 1px solid var(--border); }
    .model-row { display: grid; grid-template-columns: auto minmax(0,1fr) auto; align-items: center; gap: 22px; padding: 10px 0 24px; }
    .model-symbol { display: grid; width: 58px; height: 58px; place-items: center; border-radius: 50%; background: var(--primary); }
    .model-symbol img { width: 31px; height: 31px; filter: invert(1); }
    .model-name { display: flex; min-width: 0; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; overflow-wrap: anywhere; font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
    .badge { display: inline-flex; align-items: center; gap: 6px; min-height: 24px; padding: 2px 8px; border: 1px solid var(--border-strong); border-radius: 6px; color: var(--text-soft); font-size: 12px; font-weight: 600; }
    .badge.primary { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
    .badge.success { border-color: color-mix(in srgb,var(--success) 45%,var(--border)); color: var(--success); background: var(--success-soft); }
    .badge.warning { border-color: color-mix(in srgb,var(--warning) 45%,var(--border)); color: var(--warning); background: var(--warning-soft); }
    .badge.danger { border-color: color-mix(in srgb,var(--danger) 45%,var(--border)); color: var(--danger); background: var(--danger-soft); }
    .meta-line { display: flex; flex-wrap: wrap; gap: 10px 20px; color: var(--text-soft); font-size: 13px; }
    .meta-item { display: inline-flex; align-items: center; gap: 7px; }
    .meta-item img { width: 17px; height: 17px; opacity: .75; }
    .why { display: flex; align-items: flex-start; gap: 10px; padding: 18px 2px; color: var(--text-soft); font-size: 13px; }
    .why img { width: 20px; height: 20px; }
    .why strong { color: var(--text); }
    .facts { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); margin-top: 92px; padding: 16px 0 28px; border-bottom: 1px solid var(--border); }
    .fact { display: grid; grid-template-columns: 34px 1fr; gap: 12px; min-width: 0; padding: 0 26px; border-inline-start: 1px solid var(--border); }
    .fact:first-child { padding-inline-start: 0; border: 0; }
    .fact img { width: 30px; height: 30px; }
    .fact strong, .fact span { display: block; }
    .fact strong { font-size: 12px; }
    .fact span { overflow: hidden; color: var(--text-soft); font-size: 13px; text-overflow: ellipsis; }
    .additional { margin-top: 28px; }
    .issue-row { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 13px 0; border-top: 1px solid var(--border); }
    .quick-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit,minmax(250px,1fr)); gap: 18px; }
    .card { min-width: 0; overflow: hidden; padding: 22px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
    .card > *, .card h3, .card p, .card .mono { min-width: 0; overflow-wrap: anywhere; }
    .card:hover { border-color: var(--border-strong); }
    .card-icon { display: grid; width: 42px; height: 42px; margin-bottom: 18px; place-items: center; border-radius: 10px; background: var(--surface-subtle); }
    .card-icon img { width: 23px; height: 23px; }
    .card-footer { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-top: 20px; }
    .tabs { display: flex; gap: 4px; margin: -10px 0 28px; padding-bottom: 1px; border-bottom: 1px solid var(--border); }
    .tab { min-height: 42px; padding: 0 14px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--text-soft); cursor: pointer; }
    .tab.active { border-color: var(--primary); color: var(--primary); font-weight: 650; }
    .field { display: grid; gap: 7px; margin-bottom: 16px; }
    .field label { font-size: 13px; font-weight: 600; }
    .input, .select, .textarea { width: 100%; min-height: 42px; padding: 9px 12px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--surface); color: var(--text); }
    .textarea { min-height: 92px; resize: vertical; }
    .copy-field { display: grid; grid-template-columns: minmax(0,1fr) auto; }
    .copy-field .input { border-start-end-radius: 0; border-end-end-radius: 0; }
    .copy-field .button { border-inline-start: 0; border-start-start-radius: 0; border-end-start-radius: 0; }
    .chat-layout { display: grid; grid-template-rows: auto minmax(360px,1fr) auto; min-height: calc(100vh - 128px); }
    .chat-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding-bottom: 18px; border-bottom: 1px solid var(--border); }
    .chat-messages { display: flex; flex-direction: column; gap: 18px; padding: 28px 0; overflow-y: auto; }
    .empty { display: grid; place-items: center; min-height: 360px; text-align: center; color: var(--text-soft); }
    .empty img { width: 48px; height: 48px; margin-bottom: 16px; opacity: .55; }
    .prompt-chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 18px; }
    .prompt-chip { padding: 8px 12px; border: 1px solid var(--border); border-radius: 99px; background: var(--surface); color: var(--text-soft); cursor: pointer; }
    .message { max-width: min(760px,88%); padding: 14px 17px; border-radius: 14px; white-space: pre-wrap; }
    .message.user { align-self: flex-end; background: var(--primary); color: #fff; border-end-end-radius: 4px; }
    .message.assistant { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); border-end-start-radius: 4px; }
    .routing-detail { margin-top: 10px; color: var(--text-faint); font-size: 11px; }
    .composer { position: sticky; inset-block-end: 0; padding: 14px 0 0; background: linear-gradient(transparent,var(--bg) 18%); }
    .composer-box { display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: end; gap: 10px; padding: 10px; border: 1px solid var(--border-strong); border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); }
    .composer textarea { min-height: 48px; max-height: 160px; padding: 10px; border: 0; resize: vertical; background: transparent; color: var(--text); }
    .icon-button { display: grid; width: 42px; height: 42px; place-items: center; border: 0; border-radius: 9px; background: var(--primary); cursor: pointer; }
    .icon-button img { width: 20px; height: 20px; filter: invert(1); }
    .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 13px 15px; border-bottom: 1px solid var(--border); text-align: start; vertical-align: top; }
    th { color: var(--text-soft); background: var(--surface-subtle); font-size: 12px; font-weight: 650; }
    tr:last-child td { border-bottom: 0; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 18px; }
    .search { width: min(320px,100%); }
    .wizard-shell { display: grid; grid-template-columns: 210px minmax(0,1fr); min-height: 520px; border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; background: var(--surface); box-shadow: var(--shadow); }
    .wizard-side { padding: 24px 18px; background: var(--surface-subtle); border-inline-end: 1px solid var(--border); }
    .wizard-side h2 { font-size: 18px; }
    .wizard-progress { display: grid; gap: 9px; margin-top: 22px; }
    .wizard-step { display: grid; grid-template-columns: 25px 1fr; align-items: center; gap: 10px; color: var(--text-soft); font-size: 12px; }
    .wizard-step-number { display: grid; width: 25px; height: 25px; place-items: center; border: 1px solid var(--border-strong); border-radius: 50%; background: var(--surface); }
    .wizard-step.active { color: var(--primary); font-weight: 700; }
    .wizard-step.active .wizard-step-number { border-color: var(--primary); background: var(--primary); color: #fff; }
    .wizard-step.done .wizard-step-number { border-color: var(--success); color: var(--success); }
    .wizard-body { display: flex; flex-direction: column; min-width: 0; padding: 28px 36px 24px; }
    .wizard-content { max-width: 620px; }
    .wizard-content > h1 { font-size: clamp(28px,3vw,40px); }
    .wizard-content > p { color: var(--text-soft); font-size: 15px; }
    .wizard-options { display: grid; gap: 8px; margin-top: 18px; }
    .option { display: grid; grid-template-columns: auto 20px minmax(0,1fr); align-items: center; gap: 10px; min-height: 52px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 9px; cursor: pointer; }
    .option:hover, .option.selected { border-color: var(--primary); background: var(--primary-soft); }
    .option.disabled { opacity: .58; cursor: not-allowed; background: var(--surface-subtle); }
    .option > img { width: 19px; height: 19px; }
    .option > input + span { grid-column: 2 / -1; }
    .option input { width: 18px; height: 18px; }
    .option strong, .option span { display: block; }
    .option span { min-width: 0; overflow-wrap: anywhere; color: var(--text-soft); font-size: 13px; }
    .language-choice { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
    .language-choice .button[aria-pressed="true"] { border-color: var(--primary); background: var(--primary-soft); color: var(--primary); }
    .choice-group { margin: 20px 0 0; padding: 0; border: 0; }
    .choice-group legend { margin-bottom: 8px; font-size: 13px; font-weight: 650; }
    .acceleration { display: flex; align-items: flex-start; gap: 10px; margin-top: 18px; padding: 13px 14px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface-subtle); }
    .acceleration > img { width: 20px; height: 20px; }
    .technical-details { margin-top: 12px; color: var(--text-soft); font-size: 13px; }
    .technical-details summary { width: fit-content; cursor: pointer; color: var(--primary); }
    .technical-details .detail-body { margin-top: 10px; padding: 12px 14px; border-inline-start: 2px solid var(--border-strong); }
    .wizard-actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: auto; padding-top: 24px; }
    .progress-bar { width: 100%; height: 8px; overflow: hidden; border-radius: 99px; background: var(--surface-subtle); }
    .progress-bar > span { display: block; height: 100%; border-radius: inherit; background: var(--primary); transition: width .25s ease; }
    .log { max-height: 220px; margin-top: 18px; padding: 14px; overflow: auto; border-radius: 8px; background: #10141c; color: #d8dfec; font: 12px/1.6 var(--mono); direction: ltr; text-align: left; }
    [dir="rtl"] img[src$="arrow-right.svg"], [dir="rtl"] img[src$="arrow-left.svg"] { transform: scaleX(-1); }
    .two-col { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 18px; }
    .drawer { position: fixed; z-index: 70; inset: 0; display: none; background: rgba(7,10,16,.42); }
    .drawer.open { display: block; }
    .drawer-panel { position: absolute; inset-block: 0; inset-inline-end: 0; width: min(560px,94vw); padding: 26px; overflow-y: auto; background: var(--surface); box-shadow: var(--shadow); }
    .drawer-head { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 20px; }
    .alert-group + .alert-group { margin-top: 28px; }
    .alert-group-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
    .alerts-button { position: fixed; z-index: 35; inset-block-start: 18px; inset-inline-end: 18px; display: grid; width: 44px; height: 44px; place-items: center; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); box-shadow: var(--shadow); cursor: pointer; }
    .alerts-button:hover { border-color: var(--primary); }
    .alerts-button.has-alerts { border-color: color-mix(in srgb,var(--danger) 55%,var(--border)); background: var(--danger-soft); }
    .alerts-button img { width: 22px; height: 22px; }
    .alerts-count { position: absolute; inset-block-start: -7px; inset-inline-end: -7px; display: grid; min-width: 21px; height: 21px; padding: 0 5px; place-items: center; border: 2px solid var(--bg); border-radius: 99px; background: var(--danger); color: #fff; font-size: 11px; font-weight: 700; }
    .alerts-count[hidden] { display: none; }
    html[data-theme="dark"] .alerts-button img { filter: invert(1); }
    .json { padding: 16px; overflow: auto; border-radius: 9px; background: #10141c; color: #d8dfec; font: 12px/1.55 var(--mono); white-space: pre-wrap; direction: ltr; text-align: left; }
    .toast-region { position: fixed; z-index: 80; inset-inline-end: 22px; inset-block-end: 22px; display: grid; gap: 10px; width: min(360px,calc(100vw - 44px)); }
    .toast { padding: 13px 15px; border: 1px solid var(--border-strong); border-radius: 10px; background: var(--surface-raised); box-shadow: var(--shadow); }
    .skeleton { min-height: 20px; border-radius: 6px; background: linear-gradient(90deg,var(--surface-subtle),var(--border),var(--surface-subtle)); background-size: 200% 100%; animation: pulse 1.3s infinite; }
    @keyframes pulse { to { background-position: -200% 0; } }

      .fact:nth-child(3) { border-inline-start: 0; padding-inline-start: 0; }

      .wizard-side { border-inline-end: 0; border-bottom: 1px solid var(--border); }
      .wizard-progress { grid-template-columns: repeat(6,1fr); }
      .wizard-step { display: none; }
      .wizard-step.active { display: flex; }
    }
    @media (max-width: 620px) {
      .main { padding-inline: 16px; }
      .page-header, .toolbar { align-items: stretch; flex-direction: column; }
      .readiness, .facts, .two-col { grid-template-columns: 1fr; }
      .stage { padding-bottom: 8px; }
      .stage::after { display: none; }
      .fact { padding: 18px 0; border-inline-start: 0; border-top: 1px solid var(--border); }
      .model-row { grid-template-columns: auto minmax(0,1fr); }
      .model-row .button { grid-column: 1 / -1; width: 100%; }

      .wizard-body { padding: 24px 18px 20px; }

      .issue-row { align-items: flex-start; flex-direction: column; }
    }

        const localOptions=localModels.map(row=>option(row.id,state.wizard.modelId,`${row.name} · ${row.quant}`,`${row.size_gb||"—"} GB · ${row.path}`,"cube",false,"model-option")).join("");
        const recommendedOption=recommendation?option(recommendation.id,state.wizard.modelId,`${recommendation.name} · ${recommendation.quant}`,`${recommendation.size_gb} GB · ${textValue(recommendation.fit_reason_i18n)||recommendation.fit_reason}`,"cube",false,"model-option"):"";
        return `<h1>${t(localModels.length?"chooseRecommended":"recommendedModel")}</h1><p>${t("chooseRecommendedCopy")}</p><div class="status-banner"><div><strong>${t("modelsFolder")}</strong><div class="mono">${esc(state.setup?.discovery?.models_dir||"")}</div></div><button class="button small" data-action="models-folder">${I("folder-open")} ${t("changeFolder")}</button></div>${localModels.length?`<h3>${t("installedTab")}</h3><div class="wizard-options">${localOptions}</div>`:""}${recommendedOption?`<h3 style="margin-top:24px">${t("recommended")}</h3><div class="wizard-options">${recommendedOption}</div>`:`<div class="status-banner warning">${I("warning-circle")}<div>${t("setupRequired")}</div></div>`}${state.mode==="advanced"&&alternatives.length?`<details class="technical-details"><summary>${t("otherModels")}</summary><div class="wizard-options">${alternatives.map(row=>option(row.id,state.wizard.modelId,`${row.name} · ${row.quant}`,`${row.size_gb} GB · ${textValue(row.fit_reason_i18n)||row.fit_reason}`,"cube",false,"model-option")).join("")}</div></details>`:""}`;
      }
      if (step===5) return `<h1>${t("reviewInstall")}</h1><p>${t("reviewInstallCopy")}</p><div class="card"><div class="model-name" style="font-size:19px">${esc(model?.name||(state.wizard.runtime==="existing"?t("existing"):t("model")))}</div><div class="meta-line">${model?`<span>${t("size")}: ${esc(model.size_gb||0)} GB</span><span>${t("license")}: ${esc(model.license||"—")}</span>`:""}<span>${t("acceleration")}: ${esc(state.wizard.runtime==="existing"?t("existing"):state.wizard.backend)}</span></div><p class="mono muted" style="margin-top:16px">${esc(state.setupPlan?.destination?.models||state.setup?.discovery?.models_dir||"")}</p><button class="button small" data-action="models-folder">${I("folder-open")} ${t("changeFolder")}</button>${state.setupPlan?.steps?`<ol class="muted">${state.setupPlan.steps.map(item=>`<li>${esc(item.action.replaceAll("_"," "))}</li>`).join("")}</ol>`:""}</div><div class="wizard-options">${setupNeedsDownload()?`<label class="option"><input id="confirm-downloads" type="checkbox" ${state.wizard.confirmDownloads?"checked":""}><span><strong>${t("confirmDownloads")}</strong><span>${esc(model?.source_url||t("existing"))}</span></span></label>`:""}<label class="option"><input id="confirm-config" type="checkbox" ${state.wizard.confirmConfig?"checked":""}><span><strong>${t("confirmConfig")}</strong><span>${esc(state.setupPlan?.destination?.config||state.setup?.discovery?.config_path||"")}</span></span></label></div>`;
      if (state.setupFailure) { const memory=state.setupFailure.code==="insufficient_available_memory"; return `<h1>${t("installationFailed")}</h1><p>${esc(state.setupFailure.message)}</p><div class="log" role="status" aria-live="polite">${state.events.map(event=>`[${esc(event.status)}] ${esc(event.detail)}`).join("\n")}</div><div class="wizard-actions"><button class="button ghost" data-action="use-existing-setup">${t("useExisting")}</button><button class="button primary" data-action="retry-setup">${I("arrow-clockwise")} ${memory?t("closeAppsRescan"):t("tryAgain")}</button></div>`; }
      if (!state.setupRunning&&state.progress>=1) return `<h1>${t("setupComplete")}</h1><p>${t("setupCompleteCopy")}</p><div class="status-banner success">${I("check-circle")}<div><strong>${t("ready")}</strong><div class="muted">runtime · model · config · route</div></div></div><div class="quick-actions"><button class="button primary" data-action="finish-setup">${t("startChat")} ${I("arrow-right")}</button></div>`;
      return `<h1>${t("installing")}</h1><p>${t("installingCopy")}</p><div class="progress-bar"><span style="width:${Math.round(state.progress*100)}%"></span></div><div class="log" role="status" aria-live="polite">${state.events.length?state.events.map(event=>`[${esc(event.status)}] ${esc(event.detail)}`).join("\n"):t("loading")}</div>${state.setupRunning?`<button class="button danger" style="margin-top:18px" data-action="cancel-setup">${t("cancel")}</button>`:`<button class="button primary" style="margin-top:18px" data-action="retry-setup">${I("arrow-clockwise")} ${t("tryAgain")}</button>`}`;
    }
    function wizardPage() {
      saveSetup();
      const canNext=state.wizardStep!==2||state.wizard.scanned;
      const runtimeReady=state.wizardStep!==3||(state.wizard.runtime==="existing"?Boolean(state.wizard.existingUrl||"http://127.0.0.1:8080/v1"):Boolean(state.wizard.backend));
      const modelReady=state.wizardStep!==4||state.wizard.runtime==="existing"||Boolean(state.wizard.modelId);
      const confirmed=state.wizardStep!==5||((!setupNeedsDownload()||state.wizard.confirmDownloads)&&state.wizard.confirmConfig);
      return `<div class="page"><div class="wizard-shell">${wizardSidebar()}<section class="wizard-body"><div class="wizard-content">${wizardContent()}</div>${state.wizardStep<6?`<div class="wizard-actions"><button class="button ghost" data-action="wizard-${state.wizardStep===1?"exit":"back"}">${state.wizardStep===1?t("exit"):t("back")}</button><button class="button primary" data-action="${state.wizardStep===5?"apply-setup":"wizard-next"}" ${canNext&&runtimeReady&&modelReady&&confirmed?"":"disabled"}>${state.wizardStep===5?t("installNow"):t("continue")} ${I("arrow-right")}</button></div>`:""}</section></div></div>`;
    }
    function render() {
      renderNav(); applyPreferences(); renderAlerts();
      let html;
      if (state.route.startsWith("setup")) html=wizardPage(); else if (state.route==="home") html=homePage(); else if (state.route==="chat") html=chatPage(); else if (state.route.startsWith("models")) html=modelsPage(); else if (state.route==="connections") html=connectionsPage(); else if (state.route==="advanced/fleet") html=fleetPage(); else if (state.route==="advanced/routing") html=routingPage(); else if (state.route==="advanced/providers") html=providersView(); else if (state.route==="advanced/configuration") html=configurationPage(); else html=diagnosticsPage();
      document.getElementById("main").innerHTML=html; document.getElementById("main").focus({preventScroll:true});
      requestAnimationFrame(()=>{ const messages=document.getElementById("chat-messages"); if(messages) messages.scrollTop=messages.scrollHeight; });
    }
    function routeTo(route) {
      closeDrawer();
      route=route||"home";
      if (route==="setup"&&state.wizardStep>1) route=setupRoutes[state.wizardStep-1];
      state.route=route;
      if (setupStepByRoute[route]) state.wizardStep=setupStepByRoute[route];
      history.replaceState(null,"",`#/${route}`);
      document.getElementById("sidebar").classList.remove("open");
      document.getElementById("mobile-menu").setAttribute("aria-expanded","false");
      if (route.startsWith("setup")) saveSetup();
      render();
    }
    function openDrawer(title,body) { const drawer=document.getElementById("drawer");if(!drawer.classList.contains("open"))drawerReturnFocus=document.activeElement;document.getElementById("drawer-title").textContent=title;document.getElementById("drawer-body").innerHTML=body;drawer.classList.add("open");requestAnimationFrame(()=>drawer.querySelector('[data-action="close-drawer"]')?.focus()); }
    function closeDrawer() { const drawer=document.getElementById("drawer");const wasOpen=drawer.classList.contains("open");drawer.classList.remove("open");if(wasOpen&&drawerReturnFocus?.isConnected)drawerReturnFocus.focus();drawerReturnFocus=null; }
    function openAlerts() { openDrawer(t("alerts"),`<p class="muted">${t("alertsCopy")}</p>${issuesHtml()}`); }
    function setupNeedsDownload() { return (state.setupPlan?.steps||[]).some(step=>step.action==="install_runtime"||step.action==="download_model"); }
    function setupPayload(confirm=false) { return {backend:state.wizard.runtime==="existing"?"existing":state.wizard.backend,runtime_channel:state.wizard.channel,model_id:state.wizard.runtime==="existing"?null:state.wizard.modelId,existing_url:state.wizard.existingUrl,launch_mode:state.wizard.launch,...(confirm?{confirm_download:!setupNeedsDownload()||state.wizard.confirmDownloads,confirm_write:state.wizard.confirmConfig}:{})}; }
    async function scanSystem() { state.busy=true; render(); try { state.setup=await request("/setup/scan",{method:"POST"}); state.wizard.backend=state.setup.recommended_backend||""; state.wizard.runtime=state.setup.platform_support?.status==="supported"?"native":"existing"; state.wizard.modelId=state.setup.recommendation?.id||""; state.wizard.scanned=true;setWizardStep(2); } catch(error){ toast(error.message); } finally { state.busy=false;saveSetup();render(); } }
    async function preparePlan() { try { state.setupPlan=await request("/setup/plan",{method:"POST",body:JSON.stringify(setupPayload())});setWizardStep(5);render(); } catch(error){toast(error.message);} }
    async function pollEvents() { try { const payload=await request(`/setup/events?after=${state.events.at(-1)?.id||0}`); if(payload.events?.length){ for(const event of payload.events){const last=state.events.at(-1);if(last&&last.stage===event.stage&&last.status===event.status&&last.detail===event.detail)state.events[state.events.length-1]=event;else state.events.push(event);}state.events=state.events.slice(-50);const progress=payload.events.filter(e=>typeof e.progress==="number").at(-1)?.progress;if(typeof progress==="number")state.progress=progress;render(); } } catch(_){} }
    async function applySetup() { if(state.setupRunning)return;state.setupRunning=true;setWizardStep(6);state.setupFailure=null;state.events=[];state.progress=.02;render();const timer=setInterval(pollEvents,700);try{const result=await request("/setup/apply",{method:"POST",body:JSON.stringify(setupPayload(true))});clearInterval(timer);state.setup=result.state||state.setup;state.progress=1;announce(t("setupComplete"));await loadData();}catch(error){state.setupFailure={code:error.payload?.error,message:error.message,remediation:error.payload?.remediation||[]};state.events.push({status:"error",detail:error.message});}finally{state.setupRunning=false;clearInterval(timer);saveSetup();render();} }
    async function sendChat(prompt) { const content=(prompt||document.getElementById("chat-input")?.value||"").trim(); if(!content||state.busy)return; state.messages.push({role:"user",content});saveChat();state.busy=true; state.aborter=new AbortController(); render(); try { const response=await request("/v1/chat/completions",{method:"POST",signal:state.aborter.signal,body:JSON.stringify({model:state.chatModel||"auto",messages:state.messages.filter(m=>!m.error).map(({role,content})=>({role,content})),stream:false,max_tokens:1024})}); const message=response.choices?.[0]?.message||{}; const answer=(message.content||message.reasoning_content||response.choices?.[0]?.text||"").trim(); state.messages.push({role:"assistant",content:answer||"—",routing:response.model||""}); } catch(error){ if(error.name!=="AbortError") state.messages.push({role:"assistant",content:`${t("chatFailed")} ${error.message}`,error:true}); } finally { saveChat();state.busy=false;state.aborter=null;render(); } }
    async function verifyConnection(model="auto") { try { await request("/v1/models"); toast(t("connectionOk")+` · ${model}`); } catch(error){ toast(`${t("connectionFailed")}: ${error.message}`); } }
    async function testRouting(showDrawer=true) { try { const payload=await request("/routing/request",{method:"POST",body:JSON.stringify({agent_id:"dashboard",agent_type:"human",role:state.routingRole,task_type:state.routingRole==="embed"?"embedding":"chat",requested_model:"auto",routing_strategy:state.routingStrategy})});state.routingDecision=payload;render();if(showDrawer)openDrawer(t("testRoute"),`<div class="meta-line"><span>${esc(payload.selected_model||"—")}</span><span>${esc(payload.selected_source||"—")}</span><span>${esc(payload.routing_strategy||"—")}</span></div><p class="muted">${esc((payload.reason_codes||[]).join(" · "))}</p><details><summary>${t("technicalDetails")}</summary><pre class="json">${esc(JSON.stringify(payload,null,2))}</pre></details>`); } catch(error){toast(error.message);} }
    document.addEventListener("click", async event => {
      const language=event.target.closest("[data-language]")?.dataset.language;if(language){state.lang=language;localStorage.setItem("imperium.lang",state.lang);saveSetup();render();return;}
      const route=event.target.closest("[data-route]")?.dataset.route; if(route){closeDrawer();routeTo(route);return;}
      const action=event.target.closest("[data-action]")?.dataset.action; if(!action)return;
      if(action==="close-drawer")closeDrawer();
      if(action==="show-alerts")openAlerts();
      if(action==="refresh-alerts"){await loadData();openAlerts();}
      if(action==="wizard-exit")routeTo("home");
      if(action==="wizard-back"){setWizardStep(state.wizardStep-1);render();}
      if(action==="wizard-next"){
        if(state.wizardStep===3){const input=document.getElementById("existing-url");if(input)state.wizard.existingUrl=input.value.trim();setWizardStep(4);render();}
        else if(state.wizardStep===4)preparePlan();
        else{setWizardStep(state.wizardStep+1);render();}
      }
      if(action==="scan-system")scanSystem();
      if(action==="apply-setup")applySetup();
      if(action==="retry-setup"){if(state.setupFailure?.remediation?.includes("rescan")){state.setupFailure=null;await scanSystem();}else applySetup();}
      if(action==="use-existing-setup"){state.setupFailure=null;state.wizard.runtime="existing";setWizardStep(3);render();}
      if(action==="cancel-setup")request("/setup/cancel",{method:"POST",body:"{}"}).then(()=>toast(t("cancel"))).catch(error=>toast(error.message));
      if(action==="finish-setup"){localStorage.removeItem("imperium.setup");state.wizardStep=1;routeTo("chat");}
      if(action==="select-model"){const mid=event.target.closest("[data-model]").dataset.model;state.wizard.modelId=mid;setWizardStep(4);render();}
      if(action==="choose-chat-model"){const mid=event.target.closest("[data-model]").dataset.model;state.chatModel=mid;localStorage.setItem("imperium.chatModel",state.chatModel);routeTo("chat");}
      if(action==="model-details"){const model=modelDetails(event.target.closest("[data-model]").dataset.model);openDrawer(model?.name||t("details"),`<div class="meta-line"><span>${esc(model?.quant||"—")}</span><span>${esc(model?.size_gb||"—")} GB</span><span>${esc(model?.max_ctx_fit||model?.context||"—")} ctx</span></div><p class="muted">${esc((model?.reasons||[]).join(" · ")||model?.fit_reason||model?.path||"")}</p><details><summary>${t("technicalDetails")}</summary><pre class="json">${esc(JSON.stringify(model,null,2))}</pre></details>`);}
      if(action==="models-folder"){const folder=state.setup?.discovery?.models_dir||"";openDrawer(t("modelsFolder"),`<p class="muted">${t("modelsFolderCopy")}</p><div class="field"><label for="models-folder-path">${t("destination")}</label><input class="input mono" id="models-folder-path" value="${esc(folder)}"></div><button class="button primary" data-action="save-models-folder">${t("saveFolder")}</button>`);}
      if(action==="save-models-folder"){const path=document.getElementById("models-folder-path").value.trim();try{const payload=await request("/models/directory",{method:"POST",body:JSON.stringify({path})});state.setup={...(state.setup||{}),discovery:payload.discovery};const locals=payload.discovery?.local_models||[];if(locals.length&&!locals.some(row=>row.id===state.wizard.modelId)){state.wizard.modelId="";state.wizard.preferLocal=true;}closeDrawer();toast(t("saveFolder"));await loadData();if(state.setup?.recommendation?.local){state.wizard.modelId=state.setup.recommendation.id;state.wizard.preferLocal=true;}saveSetup();render();}catch(error){toast(error.message);}}
      if(action==="integration-details"){const app=integrations.find(row=>row.id===event.target.closest("[data-integration]").dataset.integration);const base=state.status?.api?.base_url||location.origin;const model=app.id==="hermes"?(hermesConnection()?.model||app.model):app.model;openDrawer(app.name,`<p class="muted">${localized(app.copy)}</p><div class="field"><label>${t("endpoint")}</label><div class="copy-field"><input class="input mono" readonly value="${esc(base)}/v1"><button class="button" data-copy="${esc(base)}/v1">${t("copy")}</button></div></div><div class="field"><label>${t("pinnedModel")}</label><div class="copy-field"><input class="input mono" readonly value="${esc(model)}"><button class="button" data-copy="${esc(model)}">${t("copy")}</button></div></div><button class="button primary" data-verify="${esc(model)}">${t("verify")}</button>`);}
      if(action==="pin-hermes"){const harness=hermesHarness();const connection=hermesConnection();const model=document.getElementById("hermes-pin-model")?.value;if(!harness||!connection||!model)return;request(`/harnesses/${encodeURIComponent(harness.harness_id)}/connections/${encodeURIComponent(connection.name)}`,{method:"PATCH",body:JSON.stringify({model})}).then(()=>{toast(t("pinHermesSaved"));return loadData();}).catch(error=>toast(error.message));}
      if(action==="open-harness")openDrawer(t("addHarness"),`<div class="field"><label for="harness-id">ID</label><input class="input mono" id="harness-id" value="custom_app"></div><div class="field"><label for="harness-name">${t("name")}</label><input class="input" id="harness-name" value="${t("customApp")}"></div><div class="field"><label for="harness-model">${t("pinnedModel")}</label><input class="input mono" id="harness-model" value="auto"></div><button class="button primary" data-action="create-harness">${t("addHarness")}</button>`);
      if(action==="create-harness"){const id=document.getElementById("harness-id").value.trim();const name=document.getElementById("harness-name").value.trim();const model=document.getElementById("harness-model").value.trim();request("/harnesses",{method:"POST",body:JSON.stringify({harness_id:id,display_name:name,kind:"custom",protocol:"openai",location:"host",connections:{default:{model}}})}).then(()=>{toast(t("saveLocal"));closeDrawer();loadData();}).catch(error=>toast(error.message));}
      if(action==="clear-chat"){state.messages=[];localStorage.removeItem("imperium.chat");render();}
      if(action==="stop-chat")state.aborter?.abort();
      if(action==="retry-chat"){const last=[...state.messages].reverse().find(m=>m.role==="user");state.messages=state.messages.filter(m=>!m.error);if(last)sendChat(last.content);}
      if(action==="refresh")loadData();
      if(action==="show-config")openDrawer(t("rawPreview"),`<pre class="json">${esc(JSON.stringify(state.config,null,2))}</pre>`);
      if(action==="save-api-key"){state.apiKey=document.getElementById("api-key").value.trim();localStorage.setItem("imperium.apiKey",state.apiKey);toast(t("saveLocal"));loadData();}
      if(action==="fleet-start"||action==="fleet-stop"){if(action==="fleet-stop"&&!confirm(t("stopAll")+"?"))return;request(action==="fleet-start"?"/fleet/start":"/fleet/stop",{method:"POST",body:"{}"}).then(loadData).catch(error=>toast(error.message));}
      if(action==="route-test")testRouting();
    });
    document.addEventListener("change", event => {
      if(event.target.name==="runtime-option")state.wizard.runtime=event.target.value;
      if(event.target.name==="launch-option")state.wizard.launch=event.target.value;
      if(event.target.name==="model-option")state.wizard.modelId=event.target.value;
      if(event.target.id==="backend-override")state.wizard.backend=event.target.value;
      if(event.target.id==="runtime-channel")state.wizard.channel=event.target.value;
      if(event.target.id==="existing-url")state.wizard.existingUrl=event.target.value.trim();
      if(event.target.id==="confirm-downloads")state.wizard.confirmDownloads=event.target.checked;
      if(event.target.id==="confirm-config")state.wizard.confirmConfig=event.target.checked;
      if(event.target.closest(".wizard-shell")){saveSetup();render();}
      if(event.target.id==="chat-model"){state.chatModel=event.target.value;localStorage.setItem("imperium.chatModel",state.chatModel);}
      if(event.target.id==="routing-role"){state.routingRole=event.target.value;testRouting(false);}
      if(event.target.id==="routing-strategy"){state.routingStrategy=event.target.value;testRouting(false);}
    });
    document.addEventListener("submit", event => { if(event.target.id==="chat-form"){event.preventDefault();sendChat();} });
    document.addEventListener("input", event => { if(event.target.id==="chat-input")document.getElementById("chat-send").disabled=!event.target.value.trim();if(event.target.id==="fleet-search"){state.fleetQuery=event.target.value;render();document.getElementById("fleet-search")?.focus();} });
    document.addEventListener("click", event => { const copy=event.target.closest("[data-copy]")?.dataset.copy;if(copy)navigator.clipboard.writeText(copy).then(()=>toast(t("copied")));const verify=event.target.closest("[data-verify]")?.dataset.verify;if(verify)verifyConnection(verify);const prompt=event.target.closest("[data-prompt]")?.dataset.prompt;if(prompt)sendChat(prompt);const tab=event.target.closest("[data-model-tab]")?.dataset.modelTab;if(tab){state.modelTab=tab;render();} });
    document.getElementById("theme-control").addEventListener("click",()=>{state.theme=state.theme==="light"?"dark":"light";localStorage.setItem("imperium.theme",state.theme);render();});
    document.getElementById("language-control").addEventListener("click",()=>{state.lang=state.lang==="en"?"he":"en";localStorage.setItem("imperium.lang",state.lang);render();});
    document.getElementById("advanced-toggle").addEventListener("click",event=>{const open=event.currentTarget.getAttribute("aria-expanded")!=="true";event.currentTarget.setAttribute("aria-expanded",String(open));document.getElementById("advanced-nav").classList.toggle("open",open);});
    document.getElementById("mobile-menu").addEventListener("click",event=>{const open=document.getElementById("sidebar").classList.toggle("open");event.currentTarget.setAttribute("aria-expanded",String(open));});
    document.getElementById("drawer").addEventListener("click",event=>{if(event.target.id==="drawer")closeDrawer();});
    document.addEventListener("keydown",event=>{if(event.key==="Escape"){closeDrawer();document.getElementById("sidebar").classList.remove("open");document.getElementById("mobile-menu").setAttribute("aria-expanded","false");}});
    function tick(){document.getElementById("clock").textContent=new Intl.DateTimeFormat(state.lang==="he"?"he-IL":"en-US",{dateStyle:"medium",timeStyle:"short"}).format(new Date());}
    tick();setInterval(tick,30000);
    const initial=location.hash.replace(/^#\//,"");state.route=initial||"home";if(setupStepByRoute[state.route])state.wizardStep=setupStepByRoute[state.route];if(state.route==="setup"&&savedSetup.step>1)state.route=setupRoutes[savedSetup.step-1];applyPreferences();renderNav();render();loadData();
  })();
  </script>
</body>
</html>
