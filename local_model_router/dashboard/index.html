<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="application-name" content="Imperium">
  <link rel="icon" href="/ui/icons/cube.svg" type="image/svg+xml">
  <title>Imperium — Local model router</title>
  <meta name="imperium-setup-token" content="__IMPERIUM_SETUP_TOKEN__">
  <meta name="imperium-version" content="__IMPERIUM_VERSION__">
  <link rel="stylesheet" href="/ui/assets/styles.css">
</head>
<body>
  <button class="mobile-menu" id="mobile-menu" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false"><img src="/ui/icons/sidebar-simple.svg" alt=""></button>
  <button class="alerts-button" id="alerts-button" data-action="show-alerts" aria-controls="drawer" aria-haspopup="dialog" aria-label="System alerts"><img src="/ui/icons/warning-circle.svg" alt=""><span class="alerts-count" id="alerts-count" aria-hidden="true" hidden>0</span></button>
  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
      <div class="brand">
        <div class="brand-mark"><img src="/ui/icons/cube.svg" alt=""></div>
        <div><strong>Imperium</strong><span>local model router</span><small class="version">v__IMPERIUM_VERSION__</small></div>
      </div>
      <nav class="nav" id="simple-nav"></nav>
      <div class="advanced">
        <button class="advanced-toggle" id="advanced-toggle" aria-expanded="false">
          <img src="/ui/icons/gear-six.svg" alt=""><span data-i18n="advanced">Advanced</span><img class="caret" src="/ui/icons/caret-down.svg" alt="">
        </button>
        <nav class="advanced-items" id="advanced-nav"></nav>
      </div>
      <div class="sidebar-footer">
        <button class="side-control" id="theme-control"><img src="/ui/icons/sun.svg" alt=""><span data-i18n="theme">Theme</span><span class="side-value" id="theme-value">Light</span></button>
        <button class="side-control" id="language-control"><img src="/ui/icons/translate.svg" alt=""><span data-i18n="language">Language</span><span class="side-value" id="language-value">English</span></button>
        <div class="system-time"><span class="status-dot"></span><div><span class="muted" data-i18n="systemTime">System time</span><strong id="clock" style="display:block"></strong></div></div>
      </div>
    </aside>
    <main class="main" id="main" tabindex="-1"></main>
  </div>
  <div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title"><div class="drawer-panel"><div class="drawer-head"><h2 id="drawer-title">Details</h2><button class="button small" data-action="close-drawer"><img src="/ui/icons/x.svg" alt=""><span data-i18n="close">Close</span></button></div><div id="drawer-body"></div></div></div>
  <div class="toast-region" id="toasts" aria-live="polite"></div>
  <div class="sr-only" id="live" aria-live="polite"></div>
  <script defer src="/ui/assets/i18n.js"></script>
  <script defer src="/ui/assets/app.js"></script>
</body>
</html>
